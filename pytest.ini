[pytest]
# Only collect our own tests (the upstream project has thousands of its own files).
testpaths = tests
pythonpath = tests
# -ra            : print a short summary of skipped/xfailed tests at the end
# --strict-markers: a typo in a marker name is an error instead of being ignored
addopts = -ra --strict-markers

# Test GROUPS. Run one group with:  pytest -m <name>
markers =
    smoke: quick sanity checks, one per function (runs first)
    ecp: equivalence class partitioning tests
    boundary: boundary value analysis tests
    negative: invalid input / error handling tests
    module: whole-module tests (several functions or the file as a unit)
    csv: data-driven tests that read their data from data/test_cases.csv
    defect: tests that expose a known bug in the project (marked xfail)
